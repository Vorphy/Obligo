name: Publikacja strony (GitHub Pages)

# Wdraża kalkulator na GitHub Pages:
#  - po każdym pushu na main (zmiany w kodzie),
#  - na wywołanie z workflow "Aktualizacja oferty obligacji" (nowe dane),
#  - ręcznie: zakładka Actions -> Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # przy wywołaniu po aktualizacji danych - weź najnowszy commit

      - name: Przygotuj pliki strony
        run: |
          mkdir _site
          cp index.html engine.js data.js data.json _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
